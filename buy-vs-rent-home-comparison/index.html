    <!-- Pure Simulation Engine & Application Scripts -->
    <script>
      /**
       * Default Parameters Schema
       */
      const DEFAULT_BUY_VS_RENT_PARAMS = {
        // Horizon & Macro
        horizonYears: 20,
        currency: "VND",
        propertyAppreciationRate: 6.0, // % per year
        rentInflationRate: 4.0, // % per year
        cpiInflationRate: 3.5, // % per year

        // Property & Buy Profile
        propertyType: "apartment", // 'apartment' | 'landed'
        homePrice: 3500000000, // 3.5 Billion VND
        downpaymentPercent: 30.0, // 30%

        // Upfront Acquisition Breakdown
        registrationTaxRate: 0.5, // % (Lệ phí trước bạ)
        notaryAndLegalRate: 0.1, // %
        initialFurnishingAmount: 150000000, // 150M VND
        loanOriginationAndInsurance: 0,

        // Mortgage Financing
        loanTenureYears: 20,
        amortizationScheme: "linear_principal", // 'linear_principal' | 'fixed_emi'
        teaserRateMonths: 24,
        teaserAnnualRate: 6.5,
        floatingAnnualRate: 10.5,
        extraMonthlyPrincipal: 0,

        // Ongoing Ownership Expenses
        monthlyBuildingManagementHOA: 1500000,
        annualMaintenanceRate: 0.5,
        annualPropertyTaxInsurance: 5000000,
        sellingFrictionRate: 2.5,

        // Rent Profile
        monthlyRent: 14000000, // 14M VND
        securityDepositMonths: 2,
        initialRenterMoveInCost: 20000000,
        monthlyTenantInsurance: 0,

        // Opportunity Investment
        rentInvestmentYield: 8.0, // % p.a.

        // View Modes
        useRealPurchasingPower: false,
      };

      /**
       * Rule-of-thumb: Price-to-Rent Ratio
       */
      function calculatePriceToRentRatio(homePrice, monthlyRent) {
        if (!monthlyRent || monthlyRent <= 0) return 0;
        return homePrice / (monthlyRent * 12);
      }

      /**
       * Rule-of-thumb: Gross Rental Yield (%)
       */
      function calculateGrossRentalYield(homePrice, monthlyRent) {
        if (!homePrice || homePrice <= 0) return 0;
        return ((monthlyRent * 12) / homePrice) * 100;
      }

      /**
       * Mortgage Monthly Payment Calculator
       */
      function calculateMortgagePayment({
        principal,
        annualRate,
        tenureMonths,
        scheme = "fixed_emi",
        currentRemainingPrincipal = null,
      }) {
        if (principal <= 0 || tenureMonths <= 0) return 0;
        const monthlyRate = (annualRate || 0) / 100 / 12;
        const remPrincipal =
          currentRemainingPrincipal !== null
            ? currentRemainingPrincipal
            : principal;

        if (monthlyRate === 0) {
          return scheme === "linear_principal"
            ? principal / tenureMonths
            : remPrincipal / tenureMonths;
        }

        if (scheme === "linear_principal") {
          const principalMonthly = principal / tenureMonths;
          const interestMonthly = remPrincipal * monthlyRate;
          return principalMonthly + interestMonthly;
        }

        // Fixed EMI (Annuity)
        const factor = Math.pow(1 + monthlyRate, tenureMonths);
        return (remPrincipal * (monthlyRate * factor)) / (factor - 1);
      }

      /**
       * Pure Dual-Path Simulation Engine
       * Evaluates Buy Path vs Rent & Invest Path month-by-month
       */
      function simulateBuyVsRent(rawParams = {}) {
        const p = { ...DEFAULT_BUY_VS_RENT_PARAMS, ...rawParams };

        const totalMonths = Math.max(
          1,
          Math.min(600, Math.round((p.horizonYears || 20) * 12))
        );
        const loanMonths = Math.max(
          1,
          Math.round((p.loanTenureYears || 20) * 12)
        );

        // Upfront Buy Calculations
        const downpayment = p.homePrice * ((p.downpaymentPercent || 0) / 100);
        const loanPrincipal = Math.max(0, p.homePrice - downpayment);
        const regTax = p.homePrice * ((p.registrationTaxRate || 0) / 100);
        const notaryLegal = p.homePrice * ((p.notaryAndLegalRate || 0) / 100);
        const initialFurnishing = p.initialFurnishingAmount || 0;
        const loanOrigination = p.loanOriginationAndInsurance || 0;

        const initialBuyOutflow =
          downpayment +
          regTax +
          notaryLegal +
          initialFurnishing +
          loanOrigination;

        // Upfront Rent Calculations
        const initialSecurityDeposit =
          (p.monthlyRent || 0) * (p.securityDepositMonths || 0);
        const initialMoveIn = p.initialRenterMoveInCost || 0;
        const initialRentOutflow = initialSecurityDeposit + initialMoveIn;

        // Starting Rent Portfolio Balance
        const initialRentPortfolio = Math.max(
          0,
          initialBuyOutflow - initialRentOutflow
        );

        // Simulation State
        let remainingLoan = loanPrincipal;
        let currentHomeValue = p.homePrice;
        let currentDeposit = initialSecurityDeposit;
        let rentPortfolio = initialRentPortfolio;
        let accumulatedDeficit = 0;

        let cumulativeSunkCostBuy = regTax + notaryLegal + loanOrigination;
        let cumulativeSunkCostRent = initialMoveIn;
        let cumulativeBuyOutflow = initialBuyOutflow;
        let cumulativeRentOutflow = initialRentOutflow;

        let crossoverMonth = null;
        let crossoverYear = null;
        let winnerScenario = "rent";

        const timeline = [];

        const propMonthlyRate =
          Math.pow(1 + (p.propertyAppreciationRate || 0) / 100, 1 / 12) - 1;
        const cpiMonthlyRate =
          Math.pow(1 + (p.cpiInflationRate || 0) / 100, 1 / 12) - 1;
        const rentAnnualInflation = (p.rentInflationRate || 0) / 100;
        const invMonthlyRate =
          Math.pow(1 + (p.rentInvestmentYield || 0) / 100, 1 / 12) - 1;

        for (let m = 1; m <= totalMonths; m++) {
          // 1. Property Appreciation
          currentHomeValue = currentHomeValue * (1 + propMonthlyRate);

          // 2. Active Mortgage Rate
          const currentMortgageRate =
            m <= (p.teaserRateMonths || 0)
              ? p.teaserAnnualRate || 0
              : p.floatingAnnualRate || 0;
          const monthlyMortgageRate = currentMortgageRate / 100 / 12;

          // 3. Mortgage Payment & Amortization
          let mortgagePayment = 0;
          let interestPayment = 0;
          let principalPayment = 0;

          if (remainingLoan > 0 && m <= loanMonths) {
            interestPayment = remainingLoan * monthlyMortgageRate;
            const remMonths = loanMonths - m + 1;

            if (p.amortizationScheme === "linear_principal") {
              const basePrincipal = loanPrincipal / loanMonths;
              principalPayment = Math.min(
                remainingLoan,
                basePrincipal + (p.extraMonthlyPrincipal || 0)
              );
            } else {
              // Fixed EMI
              if (monthlyMortgageRate > 0) {
                const factor = Math.pow(1 + monthlyMortgageRate, remMonths);
                const emi =
                  (remainingLoan * (monthlyMortgageRate * factor)) /
                  (factor - 1);
                principalPayment = Math.min(
                  remainingLoan,
                  emi - interestPayment + (p.extraMonthlyPrincipal || 0)
                );
              } else {
                principalPayment = Math.min(
                  remainingLoan,
                  remainingLoan / remMonths + (p.extraMonthlyPrincipal || 0)
                );
              }
            }
            mortgagePayment = interestPayment + principalPayment;
            remainingLoan = Math.max(0, remainingLoan - principalPayment);
          }

          // 4. Ownership Expenses
          const cpiFactor = Math.pow(
            1 + (p.cpiInflationRate || 0) / 100,
            (m - 1) / 12
          );
          const monthlyMaintenance =
            currentHomeValue * ((p.annualMaintenanceRate || 0) / 100 / 12);
          const monthlyHOA = (p.monthlyBuildingManagementHOA || 0) * cpiFactor;
          const monthlyTaxIns =
            ((p.annualPropertyTaxInsurance || 0) / 12) * cpiFactor;

          const monthlyBuyOutflow =
            mortgagePayment + monthlyMaintenance + monthlyHOA + monthlyTaxIns;
          cumulativeBuyOutflow += monthlyBuyOutflow;

          const currentMonthlySunkBuy =
            interestPayment + monthlyMaintenance + monthlyHOA + monthlyTaxIns;
          cumulativeSunkCostBuy += currentMonthlySunkBuy;

          // 5. Rent Outflow & Deposit Escalation
          const rentYearOffset = Math.floor((m - 1) / 12);
          const currentMonthlyRent =
            (p.monthlyRent || 0) *
            Math.pow(1 + rentAnnualInflation, rentYearOffset);
          const monthlyTenantIns = (p.monthlyTenantInsurance || 0) * cpiFactor;

          const nextDeposit =
            currentMonthlyRent * (p.securityDepositMonths || 0);
          const depositDelta = Math.max(0, nextDeposit - currentDeposit);
          currentDeposit = nextDeposit;

          const monthlyRentOutflow =
            currentMonthlyRent + monthlyTenantIns + depositDelta;
          cumulativeRentOutflow += monthlyRentOutflow;
          cumulativeSunkCostRent += currentMonthlyRent + monthlyTenantIns;

          // 6. Opportunity Delta Sweep
          const cashflowDelta = monthlyBuyOutflow - monthlyRentOutflow;

          // Portfolio Yield Compounding + Delta
          if (rentPortfolio > 0) {
            rentPortfolio =
              rentPortfolio * (1 + invMonthlyRate) + cashflowDelta;
            if (rentPortfolio < 0) {
              accumulatedDeficit += -rentPortfolio;
              rentPortfolio = 0;
            }
          } else {
            if (cashflowDelta >= 0) {
              rentPortfolio = cashflowDelta;
            } else {
              accumulatedDeficit += -cashflowDelta;
            }
          }

          // 7. Equity & Realizable Net Worth
          const sellingFriction =
            currentHomeValue * ((p.sellingFrictionRate || 0) / 100);
          const netWorthBuyNominal =
            currentHomeValue - remainingLoan - sellingFriction;
          const netWorthRentNominal =
            rentPortfolio - accumulatedDeficit + currentDeposit;

          // 8. Continuous Purchasing Power Discount (Real Value)
          const realDiscountFactor = Math.pow(
            1 + (p.cpiInflationRate || 0) / 100,
            m / 12
          );
          const netWorthBuyReal = netWorthBuyNominal / realDiscountFactor;
          const netWorthRentReal = netWorthRentNominal / realDiscountFactor;

          // 9. Crossover Check
          if (
            crossoverMonth === null &&
            netWorthBuyNominal >= netWorthRentNominal
          ) {
            crossoverMonth = m;
            crossoverYear = parseFloat((m / 12).toFixed(1));
          }

          timeline.push({
            month: m,
            year: parseFloat((m / 12).toFixed(2)),
            homeMarketValue: currentHomeValue,
            remainingLoanPrincipal: remainingLoan,
            sellingFriction: sellingFriction,
            mortgagePayment: mortgagePayment,
            interestPayment: interestPayment,
            principalPayment: principalPayment,
            mortgageInterestRate: currentMortgageRate,
            monthlyMaintenance: monthlyMaintenance,
            monthlyHOA: monthlyHOA,
            monthlyTaxIns: monthlyTaxIns,
            monthlyBuyOutflow: monthlyBuyOutflow,
            cumulativeBuyOutflow: cumulativeBuyOutflow,
            cumulativeSunkCostBuy: cumulativeSunkCostBuy,
            monthlyRent: currentMonthlyRent,
            monthlyRentOutflow: monthlyRentOutflow,
            cumulativeRentOutflow: cumulativeRentOutflow,
            cumulativeSunkCostRent: cumulativeSunkCostRent,
            cashflowDelta: cashflowDelta,
            rentPortfolioBalance: rentPortfolio,
            accumulatedDeficit: accumulatedDeficit,
            rentSecurityDeposit: currentDeposit,
            netWorthBuyNominal: netWorthBuyNominal,
            netWorthRentNominal: netWorthRentNominal,
            netWorthBuyReal: netWorthBuyReal,
            netWorthRentReal: netWorthRentReal,
            netWorthDelta: netWorthBuyNominal - netWorthRentNominal,
          });
        }

        const lastMonth = timeline[timeline.length - 1];
        const endingBuyWorth = p.useRealPurchasingPower
          ? lastMonth.netWorthBuyReal
          : lastMonth.netWorthBuyNominal;
        const endingRentWorth = p.useRealPurchasingPower
          ? lastMonth.netWorthRentReal
          : lastMonth.netWorthRentNominal;
        const netWealthDeltaAtHorizon = endingBuyWorth - endingRentWorth;

        winnerScenario = netWealthDeltaAtHorizon >= 0 ? "buy" : "rent";

        // Sunk costs at exit
        const totalSunkCostBuy =
          lastMonth.cumulativeSunkCostBuy + lastMonth.sellingFriction;
        const totalSunkCostRent = lastMonth.cumulativeSunkCostRent;

        const summary = {
          initialBuyOutflow,
          initialRentOutflow,
          initialRentPortfolio,
          loanPrincipal,
          downpayment,
          netWorthBuyEnding: endingBuyWorth,
          netWorthRentEnding: endingRentWorth,
          netWealthDeltaAtHorizon,
          winnerScenario,
          crossoverMonth,
          crossoverYear,
          totalSunkCostBuy,
          totalSunkCostRent,
          sunkCostDifference: totalSunkCostBuy - totalSunkCostRent,
          priceToRentRatio: calculatePriceToRentRatio(
            p.homePrice,
            p.monthlyRent
          ),
          grossRentalYield: calculateGrossRentalYield(
            p.homePrice,
            p.monthlyRent
          ),
          finalHomeMarketValue: lastMonth.homeMarketValue,
          finalRentPortfolio: lastMonth.rentPortfolioBalance,
        };

        return {
          params: p,
          timeline,
          summary,
        };
      }

      /**
       * 2D Sensitivity Matrix Generator
       * Evaluates Crossover Year across Property Appreciation Rates vs Rent Investment Yields
       */
      function generateSensitivityMatrix(baseParams, options = {}) {
        const propRates = options.propertyAppreciationRates || [
          3.0, 4.5, 6.0, 7.5, 9.0, 10.5,
        ];
        const invRates = options.rentInvestmentYields || [
          5.0, 6.5, 8.0, 9.5, 11.0, 12.5,
        ];

        const matrix = [];

        for (const propRate of propRates) {
          const row = {
            propertyAppreciationRate: propRate,
            cells: [],
          };

          for (const invRate of invRates) {
            const testParams = {
              ...baseParams,
              propertyAppreciationRate: propRate,
              rentInvestmentYield: invRate,
            };
            const res = simulateBuyVsRent(testParams);
            row.cells.push({
              propertyAppreciationRate: propRate,
              rentInvestmentYield: invRate,
              crossoverMonth: res.summary.crossoverMonth,
              crossoverYear: res.summary.crossoverYear,
              winnerScenario: res.summary.winnerScenario,
              netWealthDelta: res.summary.netWealthDeltaAtHorizon,
            });
          }
          matrix.push(row);
        }

        return matrix;
      }

      // Expose functions globally for UI & Node test sandbox
      if (typeof window !== "undefined") {
        window.DEFAULT_BUY_VS_RENT_PARAMS = DEFAULT_BUY_VS_RENT_PARAMS;
        window.calculatePriceToRentRatio = calculatePriceToRentRatio;
        window.calculateGrossRentalYield = calculateGrossRentalYield;
        window.calculateMortgagePayment = calculateMortgagePayment;
        window.simulateBuyVsRent = simulateBuyVsRent;
        window.generateSensitivityMatrix = generateSensitivityMatrix;
      }
    </script>
