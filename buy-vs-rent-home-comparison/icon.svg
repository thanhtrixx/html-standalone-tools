<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Slate-Indigo to Emerald Gradient -->
    <linearGradient id="bvrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Indigo Roof & Accent Gradient -->
    <linearGradient id="bvrIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Emerald Growth Curve Gradient -->
    <linearGradient id="bvrEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Emerald Shaded Area Gradient -->
    <linearGradient id="bvrEmeraldAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Amber Floating Key Badge Gradient -->
    <linearGradient id="bvrAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="bvrGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Shadow Filter -->
    <filter id="bvrCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45" />
    </filter>

    <!-- Badge Shadow Filter -->
    <filter id="bvrBadgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bvrBgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bvrGlow)" />
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- MAIN SIMULATION WORKBENCH CARD -->
  <g filter="url(#bvrCardShadow)">
    <!-- Sheet of Card -->
    <rect x="80" y="74" width="352" height="364" rx="36" fill="#FFFFFF" />

    <!-- Top Accent Header Bar -->
    <rect x="80" y="74" width="352" height="32" rx="0" fill="#F8FAFC" />
    <path d="M 80 106 L 432 106" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Window Dots / Controls -->
    <circle cx="106" cy="90" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="120" cy="90" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="134" cy="90" r="4.5" fill="#10B981" opacity="0.8" />

    <!-- Mini Title Pill -->
    <rect x="206" y="83" width="100" height="14" rx="7" fill="#E2E8F0" />

    <!-- SIMULATION CHART GRID (Background) -->
    <line x1="110" y1="160" x2="400" y2="160" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="110" y1="225" x2="400" y2="225" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="110" y1="290" x2="400" y2="290" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="110" y1="362" x2="402" y2="362" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />

    <!-- COMPARISON BAR CHART (Background Right) -->
    <rect x="296" y="295" width="18" height="67" rx="5" fill="#E2E8F0" />
    <rect x="326" y="245" width="18" height="117" rx="5" fill="#C7D2FE" />
    <rect x="356" y="175" width="18" height="187" rx="5" fill="url(#bvrEmeraldGrad)" />

    <!-- WEALTH ACCUMULATION AREA & COMPOUND CURVE -->
    <path d="M 120 362 C 170 358, 230 330, 280 270 C 320 220, 350 170, 385 142 L 385 362 Z" fill="url(#bvrEmeraldAreaGrad)" />
    <path d="M 120 362 C 170 358, 230 330, 280 270 C 320 220, 350 170, 385 142" fill="none" stroke="url(#bvrEmeraldGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- NET WORTH CROSSOVER POINT (INFLECTION) -->
    <circle cx="280" cy="270" r="14" fill="#10B981" fill-opacity="0.25" />
    <circle cx="280" cy="270" r="6.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- REAL ESTATE / HOME STRUCTURE (Buy Path) -->
    <!-- Chimney -->
    <rect x="216" y="180" width="16" height="32" rx="3" fill="#4338CA" />
    <!-- Roof with modern pitch -->
    <path d="M 112 248 L 180 186 L 248 248 Z" fill="url(#bvrIndigoGrad)" />
    <!-- House Main Frame -->
    <rect x="126" y="246" width="108" height="116" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <!-- Front Door -->
    <rect x="142" y="302" width="28" height="60" rx="5" fill="url(#bvrIndigoGrad)" />
    <!-- Doorknob -->
    <circle cx="164" cy="332" r="2" fill="#FEF08A" />
    <!-- Illuminated Window with warm glow -->
    <rect x="182" y="264" width="36" height="36" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" />
    <line x1="200" y1="264" x2="200" y2="300" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="182" y1="282" x2="218" y2="282" stroke="#F59E0B" stroke-width="1.5" />
  </g>

  <!-- HIGHLIGHT FLOATING BADGE: KEY & MOBILITY (Rent Path / Liquid Capital) -->
  <g filter="url(#bvrBadgeShadow)" transform="translate(290, 272)">
    <!-- Angled badge for dynamic modern mobile ergonomics -->
    <g transform="rotate(-8, 64, 64)">
      <!-- Background of Badge -->
      <rect x="8" y="16" width="120" height="110" rx="28" fill="url(#bvrAmberGrad)" />

      <!-- Subtle inner ring/tag hole -->
      <circle cx="68" cy="34" r="5.5" fill="#FFFFFF" opacity="0.85" />

      <!-- Golden Key Vector (Liquidity & Rent Path Freedom) -->
      <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Key Head (Bow) -->
        <circle cx="48" cy="74" r="14" />
        <!-- Key Blade / Shaft -->
        <path d="M 58 64 L 88 38" />
        <!-- Key Bits / Teeth -->
        <path d="M 78 47 L 85 53" />
        <path d="M 86 40 L 93 46" />
      </g>

      <!-- Sparkle / Star (Smart Wealth Decision) -->
      <path d="M 100 86 Q 100 93 106 93 Q 100 93 100 100 Q 100 93 94 93 Q 100 93 100 86 Z" fill="#FFFFFF" opacity="0.9" />
      <circle cx="36" cy="40" r="3" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>
</svg>