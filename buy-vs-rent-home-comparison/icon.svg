<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Crisp Modern Gradient (Sapphire to Royal Blue) -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Emerald Gradient for Checkmarks -->
    <linearGradient id="greenGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber / Orange Gradient for Price / Compare badge -->
    <linearGradient id="orangeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B132B" flood-opacity="0.32" />
    </filter>

    <!-- Badge Shadow -->
    <filter id="badgeShadow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad3)" />
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- MAIN CHECKLIST NOTEPAD -->
  <g filter="url(#shadow3)">
    <!-- Sheet of Paper -->
    <rect x="88" y="74" width="336" height="364" rx="36" fill="#FFFFFF" />

    <!-- Top Accent Bar (Folder / Pad Header) -->
    <rect x="88" y="74" width="336" height="28" rx="0" fill="#E2E8F0" />
    <!-- Clip -->
    <rect x="196" y="58" width="120" height="32" rx="10" fill="#0284C7" />
    <circle cx="256" cy="72" r="5" fill="#FFFFFF" />

    <!-- ROW 1 (Item Checked) -->
    <g transform="translate(132, 142)">
      <!-- Checkbox Circle Filled -->
      <circle cx="24" cy="24" r="22" fill="url(#greenGrad3)" />
      <path d="M14 24.5 L21 31.5 L34 17" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Text Lines -->
      <rect x="66" y="14" width="135" height="14" rx="7" fill="#334155" />
      <rect x="66" y="34" width="75" height="9" rx="4.5" fill="#94A3B8" />
    </g>

    <!-- Divider Line 1 -->
    <line x1="132" y1="214" x2="380" y2="214" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round" />

    <!-- ROW 2 (Item Checked) -->
    <g transform="translate(132, 236)">
      <!-- Checkbox Circle Filled -->
      <circle cx="24" cy="24" r="22" fill="url(#greenGrad3)" />
      <path d="M14 24.5 L21 31.5 L34 17" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Text Lines -->
      <rect x="66" y="14" width="110" height="14" rx="7" fill="#334155" />
      <rect x="66" y="34" width="60" height="9" rx="4.5" fill="#94A3B8" />
    </g>

    <!-- Divider Line 2 -->
    <line x1="132" y1="308" x2="380" y2="308" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round" />

    <!-- ROW 3 (Item Unchecked / To Buy) -->
    <g transform="translate(132, 330)">
      <!-- Checkbox Circle Outline -->
      <circle cx="24" cy="24" r="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="4" />
      <!-- Text Lines -->
      <rect x="66" y="16" width="120" height="14" rx="7" fill="#64748B" />
      <rect x="66" y="36" width="70" height="9" rx="4.5" fill="#CBD5E1" />
    </g>
  </g>

  <!-- HIGHLIGHT BADGE: PRICE COMPARISON (Floating Tag with Comparison Arrows) -->
  <g filter="url(#badgeShadow3)" transform="translate(290, 270)">
    <!-- Slanted / angled badge for dynamic mobile look -->
    <g transform="rotate(-8, 65, 65)">
      <!-- Background of Badge -->
      <rect x="10" y="20" width="116" height="106" rx="28" fill="url(#orangeGrad3)" />
      
      <!-- Subtle top inner ring/tag hole -->
      <circle cx="68" cy="38" r="6.5" fill="#FFFFFF" opacity="0.9" />

      <!-- Comparison Symbol: Up and Down exchange / comparison price arrows -->
      <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
        <!-- Down Arrow (Green / savings / lower price) -->
        <path d="M 48 62 L 48 94 M 38 84 L 48 94 L 58 84" stroke-width="6" fill="none" />
        <!-- Up Arrow (Higher price comparison) -->
        <path d="M 88 94 L 88 62 M 78 72 L 88 62 L 98 72" stroke-width="6" fill="none" opacity="0.8" />
      </g>
    </g>
  </g>
</svg>