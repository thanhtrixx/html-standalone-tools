<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#emeraldGlow)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Glowing Sound Wave / Headphone Arc -->
  <g filter="url(#glow)">
    <!-- Ambient back glow -->
    <circle cx="256" cy="240" r="140" fill="#10b981" fill-opacity="0.12"/>
  </g>

  <!-- Main Sound Waves & Speech Echo Symbolism -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer Audio Headband / Arc -->
    <path d="M 140 250 A 120 120 0 0 1 372 250" stroke="url(#emeraldGlow)" stroke-width="20" stroke-opacity="0.9"/>
    
    <!-- Sound Waves (Left) -->
    <path d="M 110 240 Q 90 250 110 260" stroke="#34d399" stroke-width="12" stroke-opacity="0.6"/>
    <path d="M 85 225 Q 60 250 85 275" stroke="#06b6d4" stroke-width="10" stroke-opacity="0.4"/>

    <!-- Sound Waves (Right) -->
    <path d="M 402 240 Q 422 250 402 260" stroke="#34d399" stroke-width="12" stroke-opacity="0.6"/>
    <path d="M 427 225 Q 452 250 427 275" stroke="#06b6d4" stroke-width="10" stroke-opacity="0.4"/>

    <!-- Ear Cups -->
    <rect x="120" y="230" width="36" height="70" rx="18" fill="url(#emeraldGlow)" stroke="#090d16" stroke-width="4"/>
    <rect x="356" y="230" width="36" height="70" rx="18" fill="url(#emeraldGlow)" stroke="#090d16" stroke-width="4"/>

    <!-- Audio Equalizer / Speech Shadowing Bars -->
    <line x1="200" y1="210" x2="200" y2="290" stroke="#38bdf8" stroke-width="14"/>
    <line x1="228" y1="180" x2="228" y2="320" stroke="#34d399" stroke-width="14"/>
    <line x1="256" y1="150" x2="256" y2="350" stroke="#10b981" stroke-width="16"/>
    <line x1="284" y1="180" x2="284" y2="320" stroke="#34d399" stroke-width="14"/>
    <line x1="312" y1="210" x2="312" y2="290" stroke="#38bdf8" stroke-width="14"/>

    <!-- Shadowing Repeat Echo Curve / Loop Arrow -->
    <path d="M 180 370 C 220 410, 292 410, 332 370" stroke="url(#amberGlow)" stroke-width="12"/>
    <polygon points="340,365 330,385 348,382" fill="#fbbf24"/>
  </g>
</svg>
