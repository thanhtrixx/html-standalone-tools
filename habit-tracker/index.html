<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:8400 https://cdn.tailwindcss.com https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob: https://trile.dev https://*.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self' http://localhost:8400 ws://localhost:8400 https://api.github.com https://www.googleapis.com https://accounts.google.com https://cloudflareinsights.com https://static.cloudflareinsights.com; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:;"
    />
    <title>Atomic Habit & Routine Tracker</title>
    <meta
      name="description"
      content="Mobile-first standalone PWA habit and routine tracker with mathematical streak/consistency models, 52-week calendar heatmaps, and local-first IndexedDB persistence."
    />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trile.dev/tools/habit-tracker/" />
    <meta property="og:title" content="Atomic Habit & Routine Tracker" />
    <meta
      property="og:description"
      content="Mobile-first standalone PWA habit and routine tracker with mathematical streak/consistency models, 52-week calendar heatmaps, and local-first IndexedDB persistence."
    />
    <meta
      property="og:image"
      content="https://trile.dev/tools/habit-tracker/og-image.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trile.dev/tools/habit-tracker/" />
    <meta name="twitter:title" content="Atomic Habit & Routine Tracker" />
    <meta
      name="twitter:description"
      content="Mobile-first standalone PWA habit and routine tracker with mathematical streak/consistency models, 52-week calendar heatmaps, and local-first IndexedDB persistence."
    />
    <meta
      name="twitter:image"
      content="https://trile.dev/tools/habit-tracker/og-image.png"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#ecfdf5",
                100: "#d1fae5",
                400: "#34d399",
                500: "#10b981",
                600: "#059669",
                700: "#047857",
              },
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --bg-base: #0b0f19;
        --bg-card: rgba(19, 28, 49, 0.7);
        --bg-surface: rgba(15, 23, 42, 0.75);
        --text-base: #f8fafc;
        --text-muted: #94a3b8;
        --border-base: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(16, 185, 129, 0.4);
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.35);
      }
      :root.light {
        --bg-base: #f8fafc;
        --bg-card: #ffffff;
        --bg-surface: #f1f5f9;
        --text-base: #0f172a;
        --text-muted: #64748b;
        --border-base: #e2e8f0;
        --border-highlight: rgba(16, 185, 129, 0.5);
        --accent: #059669;
        --accent-glow: rgba(5, 150, 105, 0.25);
      }

      body {
        background-color: var(--bg-base);
        color: var(--text-base);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Custom Themed Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(16, 185, 129, 0.5);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.3) transparent;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      input,
      textarea,
      select {
        caret-color: #10b981;
      }

      a {
        text-underline-offset: 3px;
      }

      :focus-visible {
        outline: 2px solid rgba(16, 185, 129, 0.6);
        outline-offset: 2px;
      }

      /* Reduced Motion Accessibility */
      @media (prefers-reduced-motion: reduce) {
        *,
        ::before,
        ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        .animate-ping,
        .animate-pulse,
        .animate-bounce,
        .animate-spin {
          animation: none !important;
        }
      }

      /* Native App Bottom Dock Safe Inset */
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .safe-top {
        padding-top: env(safe-area-inset-top, 16px);
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-8px);
        }
        40%,
        80% {
          transform: translateX(8px);
        }
      }
      .animate-shake {
        animation: shake 0.4s ease-in-out;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[var(--bg-base)] text-slate-900 dark:text-slate-100 flex flex-col antialiased selection:bg-emerald-500 selection:text-white pb-20 safe-bottom"
  >
    <!-- Top Header Bar -->
    <header
      class="sticky top-0 z-40 bg-white/90 dark:bg-slate-950/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/80 px-4 h-14 flex items-center justify-between safe-top shadow-xs"
    >
      <div
        class="max-w-lg mx-auto w-full flex items-center justify-between h-full"
      >
        <div class="flex items-center gap-2.5 h-8">
          <div
            class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 inline-flex items-center justify-center text-white shadow-md shadow-emerald-500/25 font-bold text-base ring-1 ring-white/20 shrink-0 leading-none"
          >
            🔥
          </div>
          <div class="flex items-center h-8">
            <h1
              class="text-sm font-black text-slate-900 dark:text-white tracking-tight leading-none flex items-center"
            >
              <span>Atomic Habits</span>
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-2 h-8">
          <!-- Freeze Token Counter Badge -->
          <button
            type="button"
            onclick="window.HabitApp.switchTab('settings')"
            class="h-8 px-2.5 inline-flex items-center justify-center gap-1.5 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full text-xs font-bold text-amber-600 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors shadow-xs tabular-nums font-mono leading-none cursor-pointer"
            title="Streak Freeze Tokens"
            aria-label="Streak Freeze Tokens"
          >
            <span class="text-xs leading-none">🛡️</span>
            <span
              id="freeze-tokens-count"
              class="tabular-nums font-mono leading-none"
              >2</span
            >
          </button>

          <!-- Language Quick Toggle -->
          <button
            type="button"
            id="lang-toggle-btn"
            onclick="window.HabitApp.toggleLanguage()"
            class="h-8 w-8 inline-flex items-center justify-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full text-sm leading-none hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors shadow-xs cursor-pointer"
            title="Ngôn ngữ: 🇻🇳 Tiếng Việt — Bấm để đổi sang 🇺🇸 English"
            aria-label="Ngôn ngữ: 🇻🇳 Tiếng Việt — Bấm để đổi sang 🇺🇸 English"
          >
            <span class="leading-none select-none">🇻🇳</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main View Container -->
    <main
      id="main-content"
      class="flex-1 max-w-lg mx-auto w-full px-4 pt-4 pb-28 relative"
    >
      <!-- Dynamic tab views rendered here -->
    </main>

    <!-- ==================== FLOATING DYNAMIC TIMER ISLAND ==================== -->
    <div
      id="floating-timer-island"
      class="fixed bottom-20 left-0 right-0 z-40 px-4 pointer-events-none hidden transition-all duration-300 transform translate-y-4 opacity-0"
      role="region"
      aria-label="Active Running Timer"
    >
      <div class="max-w-md mx-auto pointer-events-auto">
        <div
          class="bg-slate-900/95 dark:bg-slate-900/95 text-white backdrop-blur-xl border border-slate-700/80 dark:border-slate-800 shadow-2xl shadow-slate-950/50 rounded-2xl p-2.5 sm:px-4 sm:py-3 flex items-center justify-between gap-3 ring-1 ring-white/10"
        >
          <!-- Left: Clickable Habit Info + Live Ticker + Progress Bar (Opens Focus Modal) -->
          <button
            type="button"
            data-action="open-focus-timer"
            id="floating-timer-body-btn"
            class="flex items-center gap-3 min-w-0 flex-1 text-left cursor-pointer focus:outline-none group"
            title="Open Focus Timer"
          >
            <div
              id="floating-timer-icon"
              class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-lg shrink-0 group-hover:scale-105 transition-transform"
            >
              ⏱️
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <span
                  id="floating-timer-name"
                  class="text-xs sm:text-sm font-bold truncate text-white max-w-[140px] sm:max-w-[180px]"
                >
                  Habit Name
                </span>
                <span
                  id="floating-timer-pulse"
                  class="inline-block w-2 h-2 rounded-full bg-emerald-400 shrink-0 shadow-xs shadow-emerald-400/50"
                ></span>
              </div>
              <div class="flex items-center gap-2 mt-0.5">
                <span
                  id="floating-timer-ticker"
                  class="text-xs font-mono font-bold text-emerald-400 tabular-nums"
                >
                  00:00 / 20:00
                </span>
                <div
                  class="flex-1 max-w-[80px] sm:max-w-[120px] h-1.5 bg-slate-800 rounded-full overflow-hidden"
                >
                  <div
                    id="floating-timer-progress-bar"
                    class="h-full bg-gradient-to-r from-emerald-500 to-emerald-400 rounded-full transition-all duration-300"
                    style="width: 0%"
                  ></div>
                </div>
              </div>
            </div>
          </button>

          <!-- Right: Direct Play/Pause Toggle -->
          <div class="flex items-center gap-1.5 shrink-0">
            <button
              type="button"
              data-action="toggle-timer"
              id="floating-timer-play-btn"
              class="w-9 h-9 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-emerald-950 flex items-center justify-center text-sm font-black shadow-md shadow-emerald-500/25 active:scale-95 transition-all cursor-pointer"
              aria-label="Pause"
              title="Play / Pause"
            >
              ⏸
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Dock (Docked on Mobile) -->
    <nav
      class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-950/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800/90 safe-bottom"
      role="tablist"
      aria-label="Main Navigation"
    >
      <div
        class="max-w-lg mx-auto flex items-center justify-around py-1.5 px-3 gap-2"
      >
        <button
          onclick="window.HabitApp.switchTab('today')"
          data-tab="today"
          id="nav-tab-today"
          role="tab"
          aria-controls="main-content"
          aria-selected="true"
          class="nav-tab-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 px-1 rounded-2xl transition-all duration-200 active:scale-95 bg-emerald-500/15 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold ring-1 ring-emerald-500/30 shadow-sm"
        >
          <span class="text-xl">🔥</span>
          <span class="nav-label text-[11px] leading-tight">Hôm nay</span>
        </button>

        <button
          onclick="window.HabitApp.switchTab('insights')"
          data-tab="insights"
          id="nav-tab-insights"
          role="tab"
          aria-controls="main-content"
          aria-selected="false"
          class="nav-tab-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 px-1 rounded-2xl transition-all duration-200 active:scale-95 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-medium"
        >
          <span class="text-xl">📊</span>
          <span class="nav-label text-[11px] leading-tight">Thống kê</span>
        </button>

        <button
          onclick="window.HabitApp.switchTab('manager')"
          data-tab="manager"
          id="nav-tab-manager"
          role="tab"
          aria-controls="main-content"
          aria-selected="false"
          class="nav-tab-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 px-1 rounded-2xl transition-all duration-200 active:scale-95 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-medium"
        >
          <span class="text-xl">📋</span>
          <span class="nav-label text-[11px] leading-tight">Thói quen</span>
        </button>

        <button
          onclick="window.HabitApp.switchTab('settings')"
          data-tab="settings"
          id="nav-tab-settings"
          role="tab"
          aria-controls="main-content"
          aria-selected="false"
          class="nav-tab-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 px-1 rounded-2xl transition-all duration-200 active:scale-95 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-medium"
        >
          <span class="text-xl">⚙️</span>
          <span class="nav-label text-[11px] leading-tight">Cài đặt</span>
        </button>
      </div>
    </nav>

    <!-- ==================== HABIT EDIT / CREATE MODAL OVERLAY ==================== -->
    <div
      id="habit-edit-modal-overlay"
      class="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="habit-modal-title"
      onclick="if (event.target === this) window.HabitApp.closeHabitModal();"
    >
      <div id="habit-modal-container" class="w-full max-w-lg my-auto"></div>
    </div>

    <!-- ==================== HABIT DETAIL BOTTOM SHEET OVERLAY ==================== -->
    <div
      id="detail-sheet-overlay"
      class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detail-sheet-title"
      onclick="if (event.target === this) window.HabitApp.closeDetailSheet();"
    >
      <div
        id="detail-sheet-container"
        class="w-full max-w-lg safe-bottom"
      ></div>
    </div>

    <!-- ==================== HABIT DELETE CONFIRMATION MODAL OVERLAY ==================== -->
    <div
      id="delete-confirm-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="delete-dialog-title"
      aria-describedby="delete-dialog-desc"
      onclick="if (event.target === this) window.HabitApp.closeDeleteModal();"
    >
      <div id="delete-modal-container" class="w-full max-w-sm my-auto"></div>
    </div>

    <!-- ==================== DATA VAULT RESET CONFIRMATION MODAL OVERLAY ==================== -->
    <div
      id="reset-confirm-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="reset-dialog-title"
      aria-describedby="reset-dialog-desc"
      onclick="if (event.target === this) window.HabitApp.closeResetModal();"
    >
      <div id="reset-modal-container" class="w-full max-w-sm my-auto"></div>
    </div>

    <!-- ==================== IMMERSIVE FOCUS TIMER MODAL OVERLAY ==================== -->
    <div
      id="focus-timer-modal-overlay"
      class="fixed inset-0 z-[60] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="focus-timer-title"
      onclick="
        if (event.target === this) window.HabitApp.closeFocusTimerModal();
      "
    >
      <div id="focus-timer-container" class="w-full max-w-md my-auto"></div>
    </div>

    <!-- ==================== IDENTITY SETUP WIZARD MODAL OVERLAY ==================== -->
    <div
      id="identity-wizard-modal-overlay"
      class="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="wizard-modal-title"
      onclick="
        if (event.target === this) window.HabitApp.closeIdentityWizard();
      "
    >
      <div id="identity-wizard-container" class="w-full max-w-xl my-auto"></div>
    </div>

    <!-- ==================== GITHUB GIST CONFIG MODAL OVERLAY ==================== -->
    <div
      id="gist-config-modal-overlay"
      class="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gist-modal-title"
      onclick="if (event.target === this) window.HabitApp.closeGistModal();"
    >
      <div id="gist-config-container" class="w-full max-w-md my-auto"></div>
    </div>

    <!-- ==================== GOOGLE DRIVE CONFIG MODAL OVERLAY ==================== -->
    <div
      id="drive-config-modal-overlay"
      class="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drive-modal-title"
      onclick="if (event.target === this) window.HabitApp.closeDriveModal();"
    >
      <div id="drive-config-container" class="w-full max-w-md my-auto"></div>
    </div>

    <!-- ==================== ENCRYPTED VAULT UNLOCK MODAL OVERLAY ==================== -->
    <div
      id="vault-unlock-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="vault-unlock-title"
      onclick="
        if (event.target === this) window.HabitApp.closeVaultUnlockModal();
      "
    >
      <div id="vault-unlock-container" class="w-full max-w-md my-auto"></div>
    </div>

    <!-- ==================== INTERACTIVE IMPORT PREVIEW MODAL OVERLAY ==================== -->
    <div
      id="import-preview-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="import-preview-title"
      onclick="
        if (event.target === this) window.HabitApp.closeImportPreviewModal();
      "
    >
      <div id="import-preview-container" class="w-full max-w-lg my-auto"></div>
    </div>

    <!-- ==================== INTERACTIVE PASTE JSON MODAL OVERLAY ==================== -->
    <div
      id="paste-json-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="paste-json-title"
      onclick="
        if (event.target === this) window.HabitApp.closePasteJSONModal();
      "
    >
      <div id="paste-json-container" class="w-full max-w-lg my-auto"></div>
    </div>

    <!-- ==================== CLIPBOARD FALLBACK MODAL OVERLAY ==================== -->
    <div
      id="clipboard-fallback-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="clipboard-fallback-title"
      onclick="
        if (event.target === this)
          window.HabitApp.closeClipboardFallbackModal();
      "
    >
      <div
        id="clipboard-fallback-container"
        class="w-full max-w-lg my-auto"
      ></div>
    </div>

    <!-- ==================== ENCRYPTED IMPORT DECRYPT MODAL OVERLAY ==================== -->
    <div
      id="import-decrypt-modal-overlay"
      class="fixed inset-0 z-[75] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="import-decrypt-title"
      onclick="
        if (event.target === this) window.HabitApp.closeImportDecryptModal();
      "
    >
      <div id="import-decrypt-container" class="w-full max-w-md my-auto"></div>
    </div>

    <!-- ==================== EXPORT FORMAT CHOICE MODAL OVERLAY ==================== -->
    <div
      id="export-format-modal-overlay"
      class="fixed inset-0 z-[70] bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="export-format-title"
      onclick="
        if (event.target === this) window.HabitApp.closeExportFormatModal();
      "
    >
      <div id="export-format-container" class="w-full max-w-md my-auto"></div>
    </div>

    <!-- ==================== 100% VICTORY CONFETTI CANVAS ==================== -->
    <canvas
      id="confetti-canvas"
      class="fixed inset-0 pointer-events-none z-[90] w-full h-full"
    ></canvas>

    <!-- ==================== TOAST NOTIFICATIONS CONTAINER ==================== -->
    <div
      id="toast-container"
      class="fixed top-16 left-4 right-4 max-w-sm mx-auto z-[80] space-y-2 pointer-events-none flex flex-col items-center"
    ></div>

    <!-- ==================== PWA UPDATE BANNER ==================== -->
    <div
      id="pwa-update-banner"
      class="fixed bottom-20 left-4 right-4 max-w-md mx-auto z-50 hidden"
