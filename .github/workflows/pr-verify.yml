name: PR Verify

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".agents/**"
      - ".agent/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Install Playwright Browsers & System Deps
        run: bunx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright System Deps (Cache Hit)
        run: bunx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Verify Quality Gate (Lint, Build, Unit Tests & Multi-Device E2E)
        run: bun run verify

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pr
          path: test-reports/
          retention-days: 14
